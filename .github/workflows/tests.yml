name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=backend/app --cov-report=term-missing

      - name: Validate frozen QA and locked reannotation
        run: |
          python scripts/audit_evidence_coverage.py --run results/runs/frozen-30-hybrid-rrf-v1.jsonl
          python scripts/validate_eval.py
          python scripts/check_locked_reannotation.py --packet data/eval/reannotation-20260923/input --output-dir data/eval/reannotation-20260923
